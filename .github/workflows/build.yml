name: Build sepiaOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies and Initialize Keyring
        run: |
          # 1. Install base certificates and keyring first
          pacman -Sy --noconfirm --noprogressbar archlinux-keyring ca-certificates
          
          # 2. Initialize and populate the pacman keyring
          pacman-key --init
          pacman-key --populate archlinux
          
          # 3. Force database refresh and system upgrade
          pacman -Syyu --noconfirm --noprogressbar
          
          # 4. Install archiso
          pacman -S --noconfirm --noprogressbar archiso

      - name: Build the ISO
        run: mkarchiso -v -w /tmp/work -o /tmp/out .

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepiaOS-Live-ISO
          path: /tmp/out/*.iso
          retention-days: 3
